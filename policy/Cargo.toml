[package]
name = "wheatpaste-policy"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lattice-policy-rules = { git = "https://github.com/adalinxx/moniker", rev = "19155a2" }

[profile.release]
opt-level = "z"
